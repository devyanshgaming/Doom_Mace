
name: Build DoomMace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract source
        run: unzip -o DoomMace-Source.zip

      - name: Build plugin
        run: mvn --batch-mode -f doommace/pom.xml clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DoomMace-plugin
          path: doommace/target/doommace-1.0.0.jar
          if-no-files-found: error
